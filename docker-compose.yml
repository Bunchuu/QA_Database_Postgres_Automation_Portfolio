services:
  postgres-db:
    image: postgres:16-alpine
    container_name: qa_postgres_container
    environment:
      POSTGRES_DB: qa_test_db
      POSTGRES_USER: test_user
      POSTGRES_PASSWORD: secret_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: